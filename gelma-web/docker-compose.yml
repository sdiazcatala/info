version: '3.8'

services:
  # ============================================
  # Base de datos PostgreSQL
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: gelma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gelma_password}
      POSTGRES_DB: ${DB_NAME:-gelma_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - gelma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gelma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (Express.js)
  # ============================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gelma-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-gelma_password}
      DB_NAME: ${DB_NAME:-gelma_db}
      JWT_SECRET: ${JWT_SECRET:-tu_secreto_muy_seguro_cambialo_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@gelma.com}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gelma-network

  # ============================================
  # Frontend (React + Vite + Nginx)
  # ============================================
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: gelma-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - gelma-network

networks:
  gelma-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
